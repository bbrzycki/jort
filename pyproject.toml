[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jort"
version = "1.6.0"
description = "Script profiler, command tracker, benchmark runner, and notifier"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Bryan Brzycki", email = "bbrzycki@berkeley.edu"}]
dependencies = [
    "click>=8.1.3",
    "psutil>=5.9.0",
    "shortuuid==1.0.11",
]

[project.optional-dependencies]
sms = ["twilio>=8.2.0"]
database = ["pandas>=1.4.2"]
docs = ["sphinx>=6.0,<7.0", "sphinx-rtd-theme==1.2.1"]
test = ["coverage>=7.0"]
all = ["twilio>=8.2.0", "pandas>=1.4.2", "sphinx>=6.0,<7.0", "sphinx-rtd-theme==1.2.1", "coverage>=7.0"]

[project.scripts]
jort = "jort.jort_exe:cli"

[tool.setuptools.packages.find]
include = ["jort*"]
